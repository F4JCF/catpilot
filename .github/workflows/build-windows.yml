name: Construire l'exécutable Windows
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name CATPilot run.py
      - uses: actions/upload-artifact@v4
        with:
          name: CATPilot-windows
          path: dist/CATPilot.exe
      # Publie une « Release » vX.Y.Z quand le numéro de version change :
      # c'est elle que le menu « Mise à jour » du logiciel consulte.
      - name: Publier la version
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(python -c "import re;print(re.search(r'\"(.+?)\"', open('catpilot/__init__.py').read()).group(1))")
          if gh release view "v$VER" > /dev/null 2>&1; then
            echo "La version v$VER est déjà publiée"
          else
            gh release create "v$VER" dist/CATPilot.exe --title "CAT Pilot $VER" --notes-file NOTES.md
          fi
