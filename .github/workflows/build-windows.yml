name: Construire CAT Pilot (Windows et Linux)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Bibliothèque FT8 (ft8_lib)
        shell: bash
        run: |
          set +e
          which gcc || echo "::warning::gcc absent du PATH"
          gcc --version 2>&1 | head -1 | sed 's/^/::notice::/'
          python native/build_ft8.py > build_ft8.log 2>&1
          rc=$?
          if [ $rc -ne 0 ] || [ ! -f catpilot/ft8lib.dll ]; then
            grep -iE "error|erreur|undefined|cannot" build_ft8.log | head -20 | sed 's/^/::error::/'
            tail -5 build_ft8.log | sed 's/^/::error::/'
            exit 1
          fi
          python -c "import ctypes; ctypes.CDLL(r'catpilot/ft8lib.dll'); print('ft8lib OK')" 2>&1 | sed 's/^/::notice::/'
          python -c "import ctypes; ctypes.CDLL(r'catpilot/ft8lib.dll')" || { echo "::error::ft8lib.dll ne se charge pas"; exit 1; }
      - run: pyinstaller --noconfirm --onefile --windowed --name CATPilot --icon assets/catpilot.ico --add-data "assets;assets" --add-binary "catpilot/ft8lib.dll;." --collect-all pyrtlsdrlib --collect-all sstv --hidden-import PySide6.QtTextToSpeech run.py
      - name: Auto-test de l'exécutable (FT8, FT4, PSK31, RTTY, SSTV)
        shell: bash
        run: |
          ./dist/CATPilot.exe --selftest selftest.txt &
          pid=$!
          for i in $(seq 1 90); do [ -f selftest.txt ] && break; sleep 1; done
          sleep 2
          if [ ! -f selftest.txt ]; then echo "::error::l'auto-test n'a rien produit"; exit 1; fi
          sed 's/^/::notice::/' selftest.txt | grep -v "^::notice::\s" | head -20
          if grep -q "ÉCHEC" selftest.txt; then grep -A3 "ÉCHEC" selftest.txt | sed 's/^/::error::/'; exit 1; fi
      - name: Version
        id: ver
        shell: bash
        run: echo "v=$(python -c "import re;print(re.search(r'\"(.+?)\"', open('catpilot/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - name: Installateur
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyVersion=${{ steps.ver.outputs.v }}" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: CATPilot-windows
          path: |
            dist/CATPilot.exe
            dist/CATPilot-Setup-*.exe

  linux:
    runs-on: ubuntu-22.04          # glibc 2.35 : fonctionne sur Ubuntu 22.04+, Debian 12+, Mint 21+…
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paquets système
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libasound2-dev libxcb-cursor0 xvfb libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-shape0 libxcb-xkb1 libdbus-1-3 libfontconfig1 file
      - run: pip install -r requirements.txt pyinstaller
      - name: Bibliothèque FT8 (ft8_lib)
        run: |
          python native/build_ft8.py
          python -c "import ctypes; ctypes.CDLL('catpilot/libft8lib.so'); print('ft8lib OK')"
      - name: PortAudio (son, sans JACK)
        run: |
          curl -sSL https://github.com/PortAudio/portaudio/archive/refs/tags/v19.7.0.tar.gz | tar xz
          cd portaudio-19.7.0
          ./configure --without-jack --without-oss --disable-static --prefix="$PWD/../pa" > /dev/null
          make -j4 > /dev/null && make install > /dev/null
          cd ..
          mkdir -p palib && cp -L pa/lib/libportaudio.so.2 palib/
          ls -l palib
      - name: PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name CATPilot \
            --add-data "assets:assets" --add-binary "catpilot/libft8lib.so:." \
            --add-binary "palib/libportaudio.so.2:." \
            --add-binary "/usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0:." \
            --collect-all pyrtlsdrlib --collect-all sstv --hidden-import PySide6.QtTextToSpeech run.py
      - name: Auto-test (FT8, FT4, PSK31, RTTY, SSTV, son)
        run: |
          QT_QPA_PLATFORM=offscreen timeout 120 ./dist/CATPilot/CATPilot --selftest selftest.txt || true
          if [ ! -f selftest.txt ]; then echo "::error::l'auto-test n'a rien produit"; exit 1; fi
          sed 's/^/::notice::/' selftest.txt | grep -v "^::notice::\s" | head -20
          if grep -q "ÉCHEC" selftest.txt; then grep -A3 "ÉCHEC" selftest.txt | sed 's/^/::error::/'; exit 1; fi
      - name: Démarrage de la fenêtre (écran virtuel)
        run: |
          set +e
          HOME=$(mktemp -d) xvfb-run -a timeout 25 ./dist/CATPilot/CATPilot > gui.log 2>&1
          rc=$?
          tail -15 gui.log | sed 's/^/::notice::/'
          if [ $rc -ne 124 ]; then echo "::error::la fenêtre s'est fermée (code $rc)"; tail -30 gui.log | sed 's/^/::error::/'; exit 1; fi
      - name: AppImage
        run: |
          python - <<'PY'
          from PIL import Image
          im = Image.open("assets/catpilot.ico")
          im.size = max(im.ico.sizes())
          im.convert("RGBA").resize((256, 256)).save("catpilot.png")
          PY
          mkdir -p AppDir/usr/lib
          cp -a dist/CATPilot AppDir/usr/lib/catpilot
          cp catpilot.png AppDir/catpilot.png
          cp catpilot.png AppDir/.DirIcon
          cat > AppDir/catpilot.desktop <<'DESK'
          [Desktop Entry]
          Type=Application
          Name=CAT Pilot
          Comment=Pilotage CAT du Yaesu FT-991A, carnet, modes numériques
          Exec=catpilot
          Icon=catpilot
          Categories=HamRadio;Network;
          Terminal=false
          DESK
          sed -i 's/^ *//' AppDir/catpilot.desktop
          cat > AppDir/AppRun <<'RUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/lib/catpilot/CATPilot" "$@"
          RUN
          sed -i 's/^ *//' AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool -n AppDir dist/CATPilot-x86_64.AppImage
          tar czf dist/CATPilot-linux-x86_64.tar.gz -C dist CATPilot
          ls -lh dist
      - name: Auto-test de l'AppImage
        run: |
          cd dist
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 timeout 120 ./CATPilot-x86_64.AppImage --selftest ../selftest2.txt || true
          grep -c "^OK" ../selftest2.txt | sed 's/^/::notice::AppImage : tests réussis = /'
          if grep -q "ÉCHEC" ../selftest2.txt || [ ! -s ../selftest2.txt ]; then echo "::error::AppImage en échec"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: CATPilot-linux
          path: |
            dist/CATPilot-x86_64.AppImage
            dist/CATPilot-linux-x86_64.tar.gz

  # Publie une « Release » vX.Y.Z quand le numéro de version change :
  # c'est elle que le menu « Mise à jour » du logiciel consulte.
  release:
    needs: [build, linux]
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Publier la version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(python3 -c "import re;print(re.search(r'\"(.+?)\"', open('catpilot/__init__.py').read()).group(1))")
          files=$(find art -type f \( -name 'CATPilot.exe' -o -name "CATPilot-Setup-$VER.exe" -o -name '*.AppImage' -o -name '*.tar.gz' \))
          echo "$files"
          if gh release view "v$VER" > /dev/null 2>&1; then
            echo "La version v$VER est déjà publiée : ajout des fichiers manquants"
            for f in $files; do gh release upload "v$VER" "$f" 2>/dev/null || true; done
          else
            gh release create "v$VER" $files --title "CAT Pilot $VER" --notes-file NOTES.md
          fi
