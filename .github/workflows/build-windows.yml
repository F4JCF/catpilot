name: Construire l'exécutable Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Bibliothèque FT8 (ft8_lib)
        shell: bash
        run: |
          set +e
          which gcc || echo "::warning::gcc absent du PATH"
          gcc --version 2>&1 | head -1 | sed 's/^/::notice::/'
          python native/build_ft8.py > build_ft8.log 2>&1
          rc=$?
          if [ $rc -ne 0 ] || [ ! -f catpilot/ft8lib.dll ]; then
            grep -iE "error|erreur|undefined|cannot" build_ft8.log | head -20 | sed 's/^/::error::/'
            tail -5 build_ft8.log | sed 's/^/::error::/'
            exit 1
          fi
          python -c "import ctypes; ctypes.CDLL(r'catpilot/ft8lib.dll'); print('ft8lib OK')" 2>&1 | sed 's/^/::notice::/'
          python -c "import ctypes; ctypes.CDLL(r'catpilot/ft8lib.dll')" || { echo "::error::ft8lib.dll ne se charge pas"; exit 1; }
      - run: pyinstaller --noconfirm --onefile --windowed --name CATPilot --icon assets/catpilot.ico --add-data "assets;assets" --add-binary "catpilot/ft8lib.dll;." --collect-all pyrtlsdrlib --collect-all sstv run.py
      - name: Version
        id: ver
        shell: bash
        run: echo "v=$(python -c "import re;print(re.search(r'\"(.+?)\"', open('catpilot/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - name: Installateur
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyVersion=${{ steps.ver.outputs.v }}" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: CATPilot-windows
          path: |
            dist/CATPilot.exe
            dist/CATPilot-Setup-*.exe
      # Publie une « Release » vX.Y.Z quand le numéro de version change :
      # c'est elle que le menu « Mise à jour » du logiciel consulte.
      - name: Publier la version
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=${{ steps.ver.outputs.v }}
          if gh release view "v$VER" > /dev/null 2>&1; then
            echo "La version v$VER est déjà publiée"
          else
            gh release create "v$VER" dist/CATPilot.exe dist/CATPilot-Setup-$VER.exe --title "CAT Pilot $VER" --notes-file NOTES.md
          fi
